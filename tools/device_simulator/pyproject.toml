[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "portero-device-simulator"
version = "0.1.0"
description = "Protocol V1 simulator for Portero Inteligente devices"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "websockets>=14,<18",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
portero-device-simulator = "portero_simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portero_simulator"]

[tool.hatch.build.targets.wheel.force-include]
"assets/test-pattern.jpg" = "portero_simulator/assets/test-pattern.jpg"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true
