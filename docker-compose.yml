services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portero}
      POSTGRES_USER: ${POSTGRES_USER:-portero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portero_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portero_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  portero_postgres_data:

